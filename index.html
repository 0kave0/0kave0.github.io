<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Online Clutter</title>

  <link
    rel="stylesheet"
    href="style.css?v=20"
  >
</head>


<body
  style="
    background-image: url('images/pink-start2.jpg');
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
  "
>

  <header class="site-header">

    <h1>
      Online Clutter
    </h1>

    <nav>

      <a
        class="active"
        href="/"
      >
        journal
      </a>

      <a
        href="/maseniszta/"
      >
        maseniszta
      </a>

      <a
        href="#archive"
      >
        archive
      </a>

    </nav>

  </header>


  <main class="home-grid">


    <!-- JOURNAL -->

    <a
      class="home-card journal-card"
      href="#"
    >

      <img
        src="images/blur-stars.jpg"
        alt=""
      >

      <div class="card-overlay">

        <span class="eyebrow">
          legújabb cikk
        </span>

        <h2>
          Incelektől a new wave magyar popkultúráig
        </h2>

        <span class="card-link">
          olvasás →
        </span>

      </div>

      <span class="corner-star">
        ✦
      </span>

    </a>



    <!-- MASENISZTA -->

    <a
      class="home-card maseniszta-card"
      href="/maseniszta/"
    >

      <img
        src="images/dark-stars.jpg"
        alt=""
      >

      <div class="card-overlay">

        <span class="eyebrow">
          kreatív projekt
        </span>

        <h2>
          Maseniszta
        </h2>

        <span class="card-link">
          belépés →
        </span>

      </div>

      <span class="corner-moon">
        ☾
      </span>

    </a>


  </main>


  <footer>

    <span>
      notes / culture / internet / things i keep thinking about
    </span>

  </footer>


</body>

</html>
